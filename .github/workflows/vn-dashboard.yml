name: VN dashboard contract and container
on:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install . -r web/requirements.txt pytest httpx
      - run: python -m unittest discover -s tests_vn -v
      - run: node tests/test_dashboard_summary.cjs
      - run: python -m pytest tests/test_vendor_routing.py tests/test_symbol_normalization_paths.py tests/test_reporting.py tests/test_signal_processing.py
      - run: docker build -f deploy/Dockerfile -t tradingagents-vn:ci .
      - name: Container startup and volume smoke test
        run: |
          docker run -d --name vn-smoke -p 127.0.0.1:8000:8000 -e TA_WEB_PASSWORD=ci-only-password -v vn_ci_data:/data tradingagents-vn:ci
          trap 'docker logs vn-smoke; docker rm -f vn-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent -u admin:ci-only-password http://127.0.0.1:8000/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
