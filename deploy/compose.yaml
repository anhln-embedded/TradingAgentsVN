name: tradingagents-vn
services:
  dashboard: &app-service
    image: tradingagents-vn:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_REVISION: ${APP_VERSION:-local}
    env_file: .env
    environment: &app-env
      TA_ENV: production
      TA_DATA_DIR: /data
      TA_RUNTIME_ENV_FILE: /data/config/runtime.env
      TA_ALLOW_GIT_UPDATES: "false"
      TA_DATABASE_URL: postgresql+psycopg://tradingagents:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/tradingagents
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 310s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  worker:
    <<: *app-service
    ports: []
    command: [python, -m, vnapp.worker]
    healthcheck:
      disable: true
    stop_grace_period: 45s
  migrate:
    <<: *app-service
    ports: []
    command: [python, -m, vnapp.migrate]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: tradingagents
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tradingagents -d tradingagents"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  app_data:
  postgres_data:
